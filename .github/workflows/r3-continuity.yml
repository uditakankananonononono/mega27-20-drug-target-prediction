name: R3 locked continuity check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      R3_CKPT_TRANSFER_KEY: ${{ secrets.R3_CKPT_TRANSFER_KEY }}
      TORCH_HOME: /home/runner/.cache/torch
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install exact CPU package versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.0+cpu'
          python -m pip install 'numpy==2.2.6' 'scipy==1.15.3' 'rdkit==2026.3.6' 'tqdm==4.57.0'
      - name: Locked one-chunk comparison
        run: bash scripts/r3_actions_bootstrap.sh
      - name: Upload encrypted comparison checkpoint and metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r3-continuity-encrypted
          path: |
            .r3-private/comparison.enc
            .r3-private/comparison.sha256
            .r3-private/comparison.hmac
            .r3-private/comparison-log.jsonl
          retention-days: 3
